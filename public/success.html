<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration Successful</title><link rel="stylesheet" href="/styles.css"></head><body><nav><div class="brand">AARK × BSF</div><a href="/">Home</a><a href="/results.html">Results</a><a href="/timings.html">Timings</a></nav><main><div class="card success"><div class="big">✓</div><h1>Registration Successful</h1><p>Your registration is confirmed in the database.</p><div id="ticket"></div><p class="notice">Bring this ticket and the required Aadhaar copy on event day.</p><div class="row"><button onclick="window.print()">Download / Print Ticket</button><button class="secondary" onclick="alert('Google Wallet activates after issuer credentials are configured.')">Google Wallet</button><button class="secondary" onclick="alert('Apple Wallet activates after signing credentials are configured.')">Apple Wallet</button></div></div></main><script>
history.replaceState({done:true},'',location.href);history.pushState({guard:true},'',location.href);addEventListener('popstate',()=>location.replace('/'));
(async()=>{const t=new URLSearchParams(location.search).get('token');if(!t)return location.replace('/');const r=await fetch('/api/ticket/'+encodeURIComponent(t));if(!r.ok)return ticket.innerHTML='<p>Ticket could not be loaded.</p>';const d=await r.json();ticket.innerHTML=`<h2>${d.fullName}</h2><p>${d.schoolName}</p><p><b>${d.registrationId}</b> • ${d.category} • ${d.gender}</p><img class="qr" src="${d.qrDataUrl}"><p>${d.events.join(' • ')}</p>`})();
</script></body></html>
