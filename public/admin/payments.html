<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Proof Review</title><link rel="stylesheet" href="/styles.css"></head>
<body><nav><div class="brand">Payment Review</div><a href="/admin/">Dashboard</a><a href="/admin/timings.html">Timings</a><a href="/admin/results.html">Results</a><a href="/admin/checkin.html">Check-in</a></nav><main><h1>Payment Proofs</h1><p class="notice">Ticket generation does not wait for manual payment approval. This desk is for internal review and issue handling.</p><div id="out"></div></main>
<script>
async function init(){const m=await fetch('/api/admin/me').then(r=>r.json());if(!m.authenticated)return location.href='/admin/';const rows=await fetch('/api/admin/payments').then(r=>r.json());out.innerHTML=rows.map(r=>`<div class="card"><div class="grid"><div><h3>${r.full_name}</h3><p>${r.school_name}<br><b>${r.registration_id}</b><br>${r.phone}<br>₹${r.amount}</p><p>UTR: ${r.payment_utr||'—'}</p><p>Status: <b id="s-${r.registration_id}">${r.payment_status}</b></p></div><div><img src="${r.payment_proof}" style="width:260px;max-width:100%;border-radius:16px"></div></div><div class="row"><button class="good" onclick="setStatus('${r.registration_id}','Verified')">Verified</button><button class="secondary" onclick="setStatus('${r.registration_id}','Pending')">Pending</button><button class="bad" onclick="setStatus('${r.registration_id}','Issue')">Issue</button></div></div>`).join('')||'<div class="notice">No registrations yet.</div>'}
async function setStatus(id,status){const r=await fetch('/api/admin/payment-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({registrationId:id,status})});if(r.ok)document.getElementById('s-'+id).textContent=status;else alert('Could not update payment status.')}
init();
</script></body></html>
