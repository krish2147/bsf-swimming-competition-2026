<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competition Admin</title><link rel="stylesheet" href="/styles.css"></head><body><nav><div class="brand">Competition Control</div><a href="/admin/timings.html">Timings</a><a href="/admin/results.html">Results</a><a href="/admin/payments.html">Payments</a><a href="/admin/checkin.html">Check-in</a></nav><main><div id="loginBox" class="card"><h1>Staff Login</h1><input id="pin" type="password" placeholder="Admin PIN"><button onclick="login()">Enter</button><p id="msg"></p></div><div id="dash" class="hidden"><h1>Event Control Room</h1><div class="grid"><div class="card"><div id="registrations" class="stat">—</div><p>Registrations</p></div><div class="card"><div id="checkedIn" class="stat">—</div><p>Checked in</p></div><div class="card"><div id="paymentPending" class="stat">—</div><p>Payment proofs pending</p></div><div class="card"><div id="published" class="stat">—</div><p>Published events</p></div></div><div class="grid"><a class="btn" href="/admin/timings.html">Enter Timings</a><a class="btn" href="/admin/results.html">Prepare Results</a><a class="btn" href="/admin/checkin.html">Check-in</a></div></div></main><script>async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.getElementById('pin').value})});if(!r.ok){msg.textContent='Incorrect PIN';return}load()}async function load(){const m=await fetch('/api/admin/me').then(r=>r.json());if(!m.authenticated)return;loginBox.classList.add('hidden');dash.classList.remove('hidden');const d=await fetch('/api/admin/overview').then(r=>r.json());for(const k of ['registrations','checkedIn','paymentPending','published'])document.getElementById(k).textContent=d[k]}load();</script></body></html>
