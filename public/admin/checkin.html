<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/bsf-logo.jpeg"><title>Check-in</title><link rel="stylesheet" href="/styles.css"></head><body><nav><div class="brand">Entry Check-in</div><a href="/admin/">Dashboard</a><a href="/admin/timings.html">Timings</a><a href="/admin/results.html">Results</a></nav><main><h1>Ticket Verification</h1><p class="muted">Scan the ticket QR (or enter its token), compare the participant/photo and required Aadhaar copy, then approve or reject.</p><div class="card checkin-entry"><button type="button" id="scanBtn" class="checkin-scan-btn">Scan QR</button><p class="checkin-divider" aria-hidden="true"><span>or enter ticket token</span></p><div class="checkin-token-row"><input id="token" placeholder="Ticket token" aria-label="Ticket token"><button type="button" class="secondary" onclick="lookup()">Open Ticket</button></div><p id="scanError" class="notice admin-error hidden" role="alert"></p><div id="scanner" class="checkin-scanner hidden"><div class="checkin-scanner-view"><video id="scanVideo" muted playsinline aria-label="Camera preview"></video><div class="checkin-scanner-frame" aria-hidden="true"></div></div><p id="scanStatus" class="muted" role="status">Starting camera…</p><div class="row"><button type="button" class="secondary hidden" id="torchBtn" aria-pressed="false">Flashlight</button><button type="button" class="secondary" id="stopScanBtn">Stop scanning</button></div></div></div><div id="card"></div></main><script src="/admin/common.js"></script><script src="/admin/checkin.js"></script></body></html>
