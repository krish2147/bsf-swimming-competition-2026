<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-in</title><link rel="stylesheet" href="/styles.css"></head><body><nav><div class="brand">Entry Check-in</div><a href="/admin/">Dashboard</a><a href="/admin/timings.html">Timings</a><a href="/admin/results.html">Results</a></nav><main><h1>Ticket Verification</h1><p class="muted">Open a scanned ticket token, compare the participant/photo and required Aadhaar copy, then approve or reject.</p><div class="card"><div class="row"><input id="token" placeholder="Ticket token"><button onclick="lookup()">Open Ticket</button></div></div><div id="card"></div></main><script>async function init(){const m=await fetch('/api/admin/me').then(r=>r.json());if(!m.authenticated)return location.href='/admin/';const q=new URLSearchParams(location.search).get('token');if(q){token.value=q;lookup()}}async function lookup(){const t=token.value.trim();const r=await fetch('/api/admin/checkin/'+encodeURIComponent(t)),d=await r.json();if(!r.ok){card.innerHTML=`<div class="card"><h2>${d.error}</h2></div>`;return}card.innerHTML=`<div class="card"><div class="grid"><div><img src="${d.photo}" style="width:180px;max-width:100%;border-radius:16px"><h2>${d.fullName}</h2><p>${d.schoolName}</p><p><b>${d.category} • ${d.gender}</b></p><p>DOB: ${d.dob}</p><p>Current status: <b>${d.checkinStatus}</b></p></div><div><h3>Payment proof</h3><img src="${d.paymentProof}" style="width:260px;max-width:100%;border-radius:16px"><p>Payment review: ${d.paymentStatus}</p><h3>Events</h3><p>${d.events.join('<br>')}</p></div></div><label>Rejection reason</label><input id="reason"><div class="row"><button class="good" onclick="decide('Approved','${t}')">Approve</button><button class="bad" onclick="decide('Rejected','${t}')">Reject</button></div><p id="decision"></p></div>`}async function decide(d,t){const r=await fetch('/api/admin/checkin/'+encodeURIComponent(t),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:d,reason:document.getElementById('reason').value})}),j=await r.json();decision.textContent=r.ok?'Saved: '+j.status:(j.error||'Failed')}init();</script></body></html>
