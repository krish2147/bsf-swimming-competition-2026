<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timing Entry</title><link rel="stylesheet" href="/styles.css"></head>
<body><nav><div class="brand">Timing Desk</div><a href="/admin/">Dashboard</a><a href="/admin/results.html">Results</a><a href="/admin/payments.html">Payments</a><a href="/admin/checkin.html">Check-in</a></nav><main>
<h1>Enter Timings</h1><p class="notice">Timings saved here stay private. Parents see them only after the event is published from the Results Desk.</p>
<div class="card"><label>Event</label><select id="event"></select><div class="row"><div><label>Lanes per heat</label><input id="lanes" type="number" min="1" max="10" value="6"></div><div><button class="secondary" onclick="seedHeats()">Create / Reset Heats</button></div></div><div class="row"><div><label>Heat</label><input id="heat" type="number" min="1" value="1"></div><div><button onclick="loadHeat()">Open Heat</button></div></div><p id="heatInfo" class="muted"></p></div><div id="list"></div></main>
<script>
async function authed(){const m=await fetch('/api/admin/me').then(r=>r.json());if(!m.authenticated)location.href='/admin/'}
async function init(){await authed();const es=await fetch('/api/admin/events').then(r=>r.json());event.innerHTML='<option value="">Select event</option>'+es.map(e=>`<option value="${e.key}">${e.category} • ${e.gender} • ${e.event} (${e.count})</option>`).join('')}
async function seedHeats(){if(!event.value)return alert('Select an event first.');if(!confirm('Create heat/lane assignments for this event? Existing heat assignments will be reset.'))return;const r=await fetch('/api/admin/seed-heats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventKey:event.value,lanes:+lanes.value})});const j=await r.json();if(!r.ok)return alert(j.error||'Could not create heats');heat.value=1;heatInfo.textContent=`${j.participants} swimmers arranged into ${j.heats} heat(s).`;loadHeat()}
async function loadHeat(){if(!event.value)return;const d=await fetch(`/api/admin/race-card?eventKey=${encodeURIComponent(event.value)}&heatNo=${heat.value}`).then(r=>r.json());heatInfo.textContent=d.heatCount?`Heat ${heat.value} of ${d.heatCount}`:'No heat assignments yet. Click Create / Reset Heats.';list.innerHTML=d.rows.map(p=>`<div class="card"><div class="topbar"><div><span class="pill">Lane ${p.lane_no}</span> <b>${p.full_name}</b><div class="muted">${p.school_name}</div></div><span id="state-${p.registration_id}" class="pill">${p.updated_at?'Saved ✓':'Not saved'}</span></div><div class="row"><input id="time-${p.registration_id}" placeholder="e.g. 00:36.42" value="${p.timing_text||''}"><select id="status-${p.registration_id}"><option ${p.status==='TIME'?'selected':''}>TIME</option><option ${p.status==='DNS'?'selected':''}>DNS</option><option ${p.status==='DQ'?'selected':''}>DQ</option><option ${p.status==='PENDING'?'selected':''}>PENDING</option></select><button onclick="save('${p.registration_id}')">Save</button></div></div>`).join('')||'<div class="notice">No swimmers assigned to this heat.</div>'}
async function save(id){const state=document.getElementById('state-'+id);state.textContent='Saving…';const r=await fetch('/api/admin/timing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventKey:event.value,heatNo:+heat.value,registrationId:id,timingText:document.getElementById('time-'+id).value,status:document.getElementById('status-'+id).value})});state.textContent=r.ok?'Saved ✓':'Save failed';if(!r.ok)state.style.borderColor='#ff6f78'}
init();
</script></body></html>
