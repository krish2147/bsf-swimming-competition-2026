<h1>Enter Timings</h1><p class="notice">Timings saved here stay private. Parents see them only after the event is published from the Results Desk.</p>
<div class="card"><label>Event</label><select id="event"></select><div class="row"><div><label>Lanes per heat</label><input id="lanes" type="number" min="1" max="10" value="6"></div><div><button class="secondary" onclick="seedHeats()">Create / Reset Heats</button></div></div><div class="row"><div><label>Heat</label><input id="heat" type="number" min="1" value="1"></div><div><button onclick="loadHeat()">Open Heat</button></div></div><p id="heatInfo" class="muted"></p></div><div id="list"></div></main>
