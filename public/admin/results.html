<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results Control</title><link rel="stylesheet" href="/styles.css"></head><body><nav><div class="brand">Results Desk</div><a href="/admin/">Dashboard</a><a href="/admin/timings.html">Timings</a><a href="/admin/checkin.html">Check-in</a></nav><main><h1>Prepare Results</h1><p class="notice">Save podium positions privately. Publish only after the mic announcement.</p><div class="card"><label>Event</label><select id="event" onchange="openEvent()"></select></div><div id="panel"></div></main><script>let people=[];async function init(){const m=await fetch('/api/admin/me').then(r=>r.json());if(!m.authenticated)return location.href='/admin/';const es=await fetch('/api/admin/events').then(r=>r.json());event.innerHTML='<option value="">Select event</option>'+es.map(e=>`<option value="${e.key}">${e.category} • ${e.gender} • ${e.event}</option>`).join('')}async function openEvent(){if(!event.value)return;people=await fetch('/api/admin/event-participants?eventKey='+encodeURIComponent(event.value)).then(r=>r.json());const d=await fetch('/api/admin/results?eventKey='+encodeURIComponent(event.value)).then(r=>r.json());const ex=Object.fromEntries(d.entries.map(x=>[x.position,x.registration_id]));const opts=p=>'<option value="">Select swimmer</option>'+people.map(x=>`<option value="${x.registration_id}" ${ex[p]===x.registration_id?'selected':''}>${x.full_name} — ${x.school_name}</option>`).join('');panel.innerHTML=`<div class="card"><h2>Podium Draft</h2>${[1,2,3].map(p=>`<label>${p===1?'🥇 First':p===2?'🥈 Second':'🥉 Third'}</label><select id="p${p}">${opts(p)}</select><button class="secondary" onclick="savePos(${p})">Save</button><br><br>`).join('')}<p>Status: <b>${d.published?'PUBLIC':'PRIVATE DRAFT'}</b></p><button class="good" onclick="publishEvent()">Publish Results + Timings</button> <button class="bad" onclick="unpublishEvent()">Unpublish</button><p id="msg"></p></div>`}async function savePos(p){const id=document.getElementById('p'+p).value;if(!id)return;const r=await fetch('/api/admin/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventKey:event.value,position:p,registrationId:id})});msg.textContent=r.ok?'Saved privately.':'Save failed'}async function publishEvent(){if(!confirm('Mic announcement done? Publish results and timings now?'))return;const r=await fetch('/api/admin/publish-event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventKey:event.value})});if(r.ok)openEvent()}async function unpublishEvent(){const r=await fetch('/api/admin/unpublish-event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventKey:event.value})});if(r.ok)openEvent()}init();</script></body></html>
